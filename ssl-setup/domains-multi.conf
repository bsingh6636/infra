# ============================================
# WILDCARD CERTIFICATE (Optional - Recommended)
# ============================================
# To use wildcard certificates for *.brijeshkushwaha.com.np:
# 1. Requires DNS-01 challenge (not HTTP-01)
# 2. Need DNS provider API credentials (Cloudflare, Route53, etc.)
# 3. Uncomment below and comment out DOMAINS_BRIJESH above:
#
# CERT_NAME_BRIJESH="brijeshkushwaha.com.np"
# DOMAINS_BRIJESH=(
#     "brijeshkushwaha.com.np"
#     "*.brijeshkushwaha.com.np"
# )
# USE_WILDCARD_BRIJESH=true
# DNS_PROVIDER="cloudflare"  # or route53, digitalocean, etc.

# ============================================
# DOMAIN GROUP 2: example-domain.com (Template)
# ============================================
# Uncomment and modify for additional domains:
#
# CERT_NAME_EXAMPLE="example-domain.com"
# DOMAINS_EXAMPLE=(
#     "example-domain.com"
#     "api.example-domain.com"
#     "app.example-domain.com"
# )

# ============================================
# DOMAIN GROUP 3: another-site.com (Template)
# ============================================
# CERT_NAME_ANOTHER="another-site.com"
# DOMAINS_ANOTHER=(
#     "another-site.com"
#     "*.another-site.com"
# )
# USE_WILDCARD_ANOTHER=true

# ============================================
# LEGACY SUPPORT (For backwards compatibility)
# ============================================
# These are used by existing SSL scripts
# Primary domain configuration (default)
CERT_NAME="${CERT_NAME_BRIJESH}"
DOMAINS=("${DOMAINS_BRIJESH[@]}")
