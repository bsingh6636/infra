# SSL-enabled Nginx Configuration
# Explicit Server Blocks for each service
#
# Cert isolation: each root domain uses its own cert.  If one cert is missing
# or expired, only that root domain's services degrade — others keep running.
#
# Cert groups:
#   cors-proxy.brijeshkushwaha.com.np  →  *.brijeshkushwaha.com.np subdomains
#   subsnepal.com                       →  *.subsnepal.com subdomains
#   brijeshdev.space                    →  *.brijeshdev.space subdomains
#   brijeshhq.com                       →  *.brijeshhq.com subdomains
#
# Before starting nginx, run:  sudo bash ssl-setup/ensure-fallback-cert.sh
# This creates self-signed certs for any missing paths so nginx always starts.

# --- Security hardening (http context; inherited by every server/location) ---
# Hide the nginx version from the Server header to blunt CVE fingerprinting.
server_tokens off;

# Security response headers. Defined once here so they are inherited by every
# server and location block below. IMPORTANT: nginx drops inherited add_header
# directives in any block that declares its own add_header — so do NOT add
# per-block add_header directives, or these will silently stop applying there.
# HSTS over plain HTTP is ignored by browsers (RFC 6797), so a single global
# declaration is safe. Ramp deliberately: start at 5 minutes with NO
# includeSubDomains/preload (both are effectively irreversible for ~1 year).
# Raise to 86400, then 31536000, and add includeSubDomains/preload only after
# every subdomain is confirmed serving healthy HTTPS.
add_header Strict-Transport-Security "max-age=300" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# CSP ships in Report-Only first so it cannot break the SPA, Telegram login, or
# remote images. Review violation reports, then promote to an enforcing
# Content-Security-Policy header once the policy is proven clean.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://telegram.org https://*.telegram.org; frame-src https://oauth.telegram.org; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

# Default server — catches unknown hosts on both 80 and 443.
# The :443 block needs a cert; we use the first cert in the group.
# ensure-fallback-cert.sh guarantees this path exists even if the real cert
# hasn't been issued yet.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/cors-proxy.brijeshkushwaha.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cors-proxy.brijeshkushwaha.com.np/privkey.pem;
    return 444;
}

# ── brijeshkushwaha.com.np  (cert: cors-proxy.brijeshkushwaha.com.np) ─────────

# Portfolio
server {
    listen 80;
    server_name portfolio.brijeshkushwaha.com.np brijeshkushwaha.com.np;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name portfolio.brijeshkushwaha.com.np brijeshkushwaha.com.np;

    ssl_certificate /etc/letsencrypt/live/cors-proxy.brijeshkushwaha.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cors-proxy.brijeshkushwaha.com.np/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://portfolio:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 = @spa_fallback_portfolio;
    }
    location @spa_fallback_portfolio {
        rewrite ^ /index.html break;
        proxy_pass http://portfolio:80;
        proxy_set_header Host $host;
    }
}

# Frontend / Proxy Service
server {
    listen 80;
    server_name cors-proxy.brijeshkushwaha.com.np cors-proxy2.brijeshkushwaha.com.np;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Allow Port 80 traffic for Azure CDN compatibility
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name cors-proxy.brijeshkushwaha.com.np cors-proxy2.brijeshkushwaha.com.np;

    ssl_certificate /etc/letsencrypt/live/cors-proxy.brijeshkushwaha.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cors-proxy.brijeshkushwaha.com.np/privkey.pem;
