# Production Docker Compose with SSL Support
# Includes volume mounts for Let's Encrypt certificates

networks:
  bsingh-net:
    driver: bridge

services:
  nginx:
    image: bsingh6636/bsingh-nginx:latest
    container_name: bsingh-nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - bsingh-net
    depends_on:
      - backend
      - frontend
      - getdata
      - portfolio
      - bae-portfolio
      - subsnepal-frontend
      - subsnepal-backend
      - municipal-backend
    volumes:
      # Mount the SSL nginx config (overrides image config)
      - ./ssl-setup/bsingh-ssl.conf:/etc/nginx/conf.d/bsingh.conf:ro
      # Mount SSL certificates (read-only)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      # Optional: Mount certbot webroot for renewals
      - ./certbot/www:/var/www/certbot:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: bsingh6636/bsingh-backend:latest
    container_name: bsingh-backend
    networks:
      - bsingh-net
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=256
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  frontend:
    image: bsingh6636/bsingh-frontend:latest
    container_name: bsingh-frontend
    networks:
      - bsingh-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M

  getdata:
    image: bsingh6636/bsingh-getdata:latest
    container_name: bsingh-getdata
    networks:
      - bsingh-net
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M

  portfolio:
    image: bsingh6636/bsingh-portfolio:latest
    container_name: bsingh-portfolio
    networks:
      - bsingh-net
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  bae-portfolio:
    image: bsingh6636/bsingh-bae-portfolio:latest
    container_name: bsingh-bae-portfolio
    networks:
      - bsingh-net
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  subsnepal-frontend:
    image: bsingh6636/bsingh-subsnepal-frontend:latest
    container_name: bsingh-subsnepal-frontend
    networks:
      - bsingh-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  subsnepal-backend:
    image: bsingh6636/bsingh-subsnepal-backend:latest
    container_name: bsingh-subsnepal-backend
    networks:
      - bsingh-net
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M

  municipal-backend:
    image: bsingh6636/bsingh-municipal-backend:latest
    container_name: bsingh-municipal-backend
    networks:
      - bsingh-net
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=128
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
