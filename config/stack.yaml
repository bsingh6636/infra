version: 1

project:
  name: brijesh
  network: brijesh-net
  release_root: /opt/brijesh-infra/releases
  data_root: /opt/brijesh-infra/data
  live_symlink: /opt/brijesh-infra/live/current
  release_retention: 10

build:
  backend_strategy: local-build-push
  edge_static_strategy: local-build-sync
  isolated_static_strategy: local-build-image-push
  image_tag_style: git-sha

tls:
  root_domains:
    brijeshkushwaha.com.np:
      mode: wildcard_dns
      dns_provider: cloudflare
      cert_name: cors-proxy.brijeshkushwaha.com.np
    subsnepal.com:
      mode: wildcard_dns
      dns_provider: cloudflare
      cert_name: subsnepal.com

env:
  global_nonsecret: env/global.env
  global_secret: env/global.secrets.env
  service_nonsecret_dir: env/services
  service_secret_dir: env/services-secrets

sources:
  educors:
    repo: https://github.com/bsingh6636/EduCors-Helper.git
    ref: master
  portfolio:
    repo: https://github.com/bsingh6636/myPortfolio.git
    ref: main
  ranju:
    repo: git@github.com:bsingh6636/cuddly-octo-funicular.git
    ref: main
  oasis:
    repo: git@github.com:bsingh6636/oasisNep.git
    ref: main
  municipal_backend:
    repo: git@github.com:codesujan01/Municipal-Backend.git
    ref: media_cleanup
  municipal_admin:
    repo: git@github.com:codesujan01/Municipal-admin-web.git
    ref: media_cleanup

groups:
  low-node:
    mode: shared-node
    runtime: node20
    process_manager: pm2
    resources:
      cpus: "0.50"
      memory: 512m

services:
  portfolio-web:
    enabled: true
    kind: frontend
    source:
      key: portfolio
      context: .
    build:
      output_dir: auto
    deploy:
      mode: edge-static

  ranju-web:
    enabled: true
    kind: frontend
    source:
      key: ranju
      context: .
    build:
      output_dir: auto
    deploy:
      mode: edge-static

  cors-web:
    enabled: true
    kind: frontend
    source:
      key: educors
      context: FrontEnd
    build:
      output_dir: auto
    deploy:
      mode: edge-static

  cors-api:
    enabled: true
    kind: backend
    source:
      key: educors
      context: BackEnd
    deploy:
      mode: shared-node
      group: low-node
    runtime:
      port: 4301
      start: npm start
    env:
      files:
        nonsecret: env/services/cors-api.env
        secret: env/services-secrets/cors-api.env
      required:
        - JWT_SECRET_KEY
        - MONGO_SRV

  getdata:
    enabled: true
    kind: backend
    source:
      key: educors
      context: getdata
    deploy:
      mode: shared-node
      group: low-node
    runtime:
      port: 4302
      start: npm start
    env:
      files:
        nonsecret: env/services/getdata.env
        secret: env/services-secrets/getdata.env

  subsnepal-web:
    enabled: true
    kind: frontend
    source:
      key: oasis
      context: reactJs
    build:
      output_dir: auto
    deploy:
      mode: isolated
      frontend_runtime: static-container
    runtime:
      container_port: 80

  subsnepal-api:
    enabled: true
    kind: backend
    source:
      key: oasis
      context: nodejs
    deploy:
      mode: isolated
    runtime:
      port: 9090
      start: npm start
    env:
      files:
        nonsecret: env/services/subsnepal-api.env
        secret: env/services-secrets/subsnepal-api.env

  municipal-admin:
    enabled: true
    kind: frontend
    source:
      key: municipal_admin
      context: .
    build:
      output_dir: auto
    deploy:
      mode: edge-static

  municipal-api:
    enabled: true
    kind: backend
    source:
      key: municipal_backend
      context: .
    deploy:
      mode: shared-node
      group: low-node
    runtime:
      port: 4303
      start: npm start
    env:
      files:
        nonsecret: env/services/municipal-api.env
        secret: env/services-secrets/municipal-api.env
      required:
        - JWT_SECRET_KEY
    storage:
      - type: bind
        source: /opt/brijesh-infra/data/municipal/media
        target: /srv/shared/municipal-api/media

ingress:
  - name: portfolio
    hosts:
      - name: brijeshkushwaha.com.np
      - name: portfolio.brijeshkushwaha.com.np
    upstream:
      type: static
      service: portfolio-web
      spa_fallback: true

  - name: ranju
    hosts:
      - name: ranju.brijeshkushwaha.com.np
    upstream:
      type: static
      service: ranju-web
      spa_fallback: true

  - name: cors-web
    hosts:
      - name: cors-proxy.brijeshkushwaha.com.np
      - name: cors-proxy2.brijeshkushwaha.com.np
    upstream:
      type: static
      service: cors-web
      spa_fallback: true
    routes:
      - path: /api/
        service: cors-api
        protocol: http

  - name: cors-api
    hosts:
      - name: api-cors-proxy.brijeshkushwaha.com.np
    upstream:
      type: proxy
      service: cors-api

  - name: getdata
    hosts:
      - name: getdata-cors-proxy.brijeshkushwaha.com.np
    upstream:
      type: proxy
      service: getdata

  - name: subsnepal-web
    hosts:
      - name: subsnepal.brijeshkushwaha.com.np
      - name: subsnepal.com
      - name: www.subsnepal.com
    upstream:
      type: proxy
      service: subsnepal-web
    routes:
      - path: /api/
        service: subsnepal-api
        protocol: http
      - path: /ws/
        service: subsnepal-api
        protocol: websocket
      - path: /events/
        service: subsnepal-api
        protocol: sse

  - name: subsnepal-api
    hosts:
      - name: api-subsnepal.brijeshkushwaha.com.np
      - name: api.subsnepal.com
    upstream:
      type: proxy
      service: subsnepal-api

  - name: municipal-admin
    hosts:
      - name: admin.municipa.brijeshkushwaha.com.np
    upstream:
      type: static
      service: municipal-admin
      spa_fallback: true
    routes:
      - path: /api/
        service: municipal-api
        protocol: http
      - path: /media/
        service: municipal-api
        protocol: http

  - name: municipal-api
    hosts:
      - name: api.muncipal.brijeshkushwaha.com.np
        acknowledge_nonstandard: true
    upstream:
      type: proxy
      service: municipal-api
