# Nginx Configuration
# Explicit Server Blocks for each service

# --- Security hardening (http context; inherited by every server/location) ---
# Hide the nginx version from the Server header to blunt CVE fingerprinting.
server_tokens off;

# Security response headers, defined once so every server/location inherits them.
# Do NOT add per-block add_header directives — nginx drops inherited add_headers
# in any block that declares its own, which would silently disable these there.
# HSTS ramp: 5 min first, no includeSubDomains/preload (both ~irreversible for a
# year). Raise to 86400 → 31536000, add the flags only once every subdomain is
# confirmed on healthy HTTPS.
add_header Strict-Transport-Security "max-age=300" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://telegram.org https://*.telegram.org; frame-src https://oauth.telegram.org; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

# Default server for Front Door / CDN origin health checks
server {
    listen 80 default_server;
    server_name _;
    location / {
        default_type text/plain;
        return 200 "OK";
    }
}

# Portfolio Service
server {
    listen 80;
    server_name portfolio.brijeshkushwaha.com.np brijeshkushwaha.com.np localhost;
    
    location / {
        proxy_pass http://portfolio:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Frontend / Proxy Service
server {
    listen 80;
    server_name cors-proxy.brijeshkushwaha.com.np cors-proxy2.brijeshkushwaha.com.np;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

